        if (bad) bits.push(`${bad} row(s) with an unreadable date`);

const INTACCT_COLUMNS = ['DONOTIMPORT', 'JOURNAL', 'DATE', 'REVERSEDATE', 'DESCRIPTION', 'REFERENCE_NO', 'LINE_NO', 'ACCT_NO', 'LOCATION_ID', 'DEPT_ID', 'CLASSID', 'DOCUMENT', 'MEMO', 'DEBIT', 'CREDIT', 'SOURCEENTITY', 'CURRENCY', 'STATE'];

function exportJournal(j) {

}

const AUDIT_FIELDS = ['ts', 'actor_email', 'actor_name', 'actor_roles', 'action', 'client_id', 'job_id', 'mapping_version', 'file_sha256', 'details'];

  ${items.length ? `<div class="panel scroll"><table><thead><tr><th>Needs</th><th>Job</th><th>Client</th><th>Pay period</th><th>Prepared by</th><th></th></tr></thead><tbody>${items.map(it => `<tr><td>${chip(it.kind, 'info')}</td><td>#${j.id}</td><td>${esc(clientOf(j.clientId).name)}</td><td>${usDate(j.start)} - ${usDate(j.end)}</td><td>${esc(it.by)}</td><td>${it.own ? '<span class="muted">You prepared this</span> · ' : ''}${btn('open:' + it.step, 'Open', 'sm')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="panel muted">Nothing is waiting for review. Run a scenario as a Preparer, then come back as a Reviewer.</div>'}`;
}
function gate(title, perm, role) {
  const u = USERS.find(x => PERMS[x.role].includes(perm));
  return `<section class="panel"><h1>${esc(title)}</h1><p>Your current role (${S.me.role}) doesn't include this. In the real tool the server refuses it too.</p><p>${btn('as:' + u.email + ':' + u.role, `Act as ${u.name} (${u.role})`, 'primary')}</p></section>`;
}
function viewAudit() {
  if (!can('audit.view')) return gate('Audit log', 'audit.view');
  const chain = verifyChain(S.audit), rows = [...S.audit].map((e, i) => ({ ...e, n: i + 1 })).reverse();
  return `<h1>Audit log</h1><p class="muted">Who did what, when, which mapping version was used, the SHA-256 of each uploaded file, and who approved each export. Entries are hash-chained.</p>
  <div class="note ${chain.ok ? 'ok' : 'bad'}">${chain.ok ? `<b>Hash chain verified</b> - ${chain.n} entries, none altered.` : `<b>TAMPERING DETECTED</b> - the chain breaks at entry #${chain.brokenAt}.`}</div>
  <div class="row">${S.tamper === null ? btn('tamper', 'Simulate someone editing an old entry') : btn('restore', 'Undo the edit', 'primary')}<span class="muted small">The database also blocks edits with triggers; this shows that even a direct edit is detectable.</span></div>
  <div class="panel scroll" style="padding:0"><table><thead><tr><th>#</th><th>When (UTC)</th><th>Who</th><th>Action</th><th>Client</th><th>Job</th><th>Map v</th><th>File SHA-256</th><th>Details</th></tr></thead><tbody>
  ${rows.map(e => `<tr><td>${e.n}</td><td class="mono small" style="white-space:nowrap">${esc(e.ts.slice(11, 19))}</td><td>${esc(e.actor_name)}<div class="muted small">${esc(e.actor_email)}${e.actor_roles ? ' · ' + esc(e.actor_roles) : ''}</div></td><td>${chip(e.action, /denied|rejected|failed/.test(e.action) ? 'bad' : '')}</td><td>${esc(e.client_id || '')}</td><td>${e.job_id ?? ''}</td><td>${e.mapping_version ?? ''}</td><td class="mono small">${e.file_sha256 ? esc(e.file_sha256.slice(0, 12)) + '…' : ''}</td><td class="mono small" style="overflow-wrap:anywhere;min-width:12rem">${e.details === '{}' ? '' : esc(e.details)}</td></tr>`).join('')}</tbody></table></div>`;
}
function viewClients() {
  if (!can('admin.clients')) return gate('Clients', 'admin.clients');
  const olg = clientOf('our-lady-grace');
  return `<h1>Clients</h1><p class="muted">Entities and allocation percentages. A change here drives the next allocated journal and is written to the audit log.</p>
  <div class="panel scroll" style="padding:0"><table><thead><tr><th>Client</th><th>Entities (allocation %)</th><th>Funds</th><th>Allocation</th></tr></thead><tbody>
  ${Object.values(S.clients).map(c => `<tr><td><b>${esc(c.name)}</b><div class="muted small">${esc(c.id)}</div></td><td>${c.entities.map(e => `${esc(e.code)} ${e.pct}%${e.paying ? ' ' + chip('pays') : ''}`).join('<br>')}</td><td>${Object.keys(c.funds).length}</td><td>${allocationProblems(c).length ? `<span class="muted small">${esc(allocationProblems(c)[0])}</span>` : chip('Ready', 'ok')}</td></tr>`).join('')}</tbody></table></div>
  <section class="panel"><h2>Allocation for ${esc(olg.name)}</h2><div class="grid2">${olg.entities.map(e => `<label class="f" for="pct-${e.code}">${esc(e.code)} - ${esc(e.name)}${e.paying ? ' (pays payroll)' : ''}<input type="number" id="pct-${e.code}" data-pct="${e.code}" value="${e.pct}" min="0" max="100" step="0.01"></label>`).join('')}</div>
    <div class="row" style="margin-top:.8rem">${btn('save-pct', 'Save allocation', 'primary')}<span class="muted small">Must add up to exactly 100.</span></div></section>`;
}
function viewAbout() {
  return `<h1>About this page</h1>
  <section class="panel"><p>This is a click-through of the <b>Journal Entry Prep</b> tool. It runs entirely in your browser on synthetic data: nothing is sent anywhere and nothing is posted to Sage Intacct or QuickBooks Online. Reloading the page resets it.</p>
    <p>The real tool is a Python (FastAPI + SQLite) web app. This page re-implements its engine in JavaScript so it can run without a server, and that engine was checked against the Python one: the same inputs produce identical journal lines, check results and export files.</p></section>
  <section class="panel"><h2>What differs from the real tool</h2><ul>
    <li><b>Sign-in</b> is the demo user switcher. The real tool uses Okta (OIDC) and shows this switcher only when DEMO_MODE is on.</li>
    <li><b>Suggestions</b> always use the labelled offline mock here. The real tool calls Claude when an API key is set, after redacting names and IDs.</li>
    <li><b>Files</b> are CSV only and held in memory. The real tool also reads Excel, stores uploads privately with a retention limit, and offers a real download.</li>
    <li><b>One job at a time</b>, and no database. The audit log lives in memory for this session.</li></ul></section>
  <section class="panel"><h2>Still needed before production</h2><ul>
    <li>Okta app registration and group provisioning.</li><li>Intacct and QuickBooks import layouts checked against each client's own template. The column layouts here are a best-effort reconstruction.</li>
    <li>Real charts of accounts, entities and funds per client.</li><li>IT and security review, including whether redacted payroll structure may be sent to the Anthropic API.</li></ul></section>
  <section class="panel"><p class="muted small">Source: branch <code>claude/focused-gates-wj776d</code> of <code>stephenmcnulty/helloworld</code>, folder <code>jeprep/</code> (this page is built from <code>jeprep/artifact/</code>).</p></section>`;
}

/* ---------- shell + events ---------- */
function render() {
  const active = document.activeElement && document.activeElement.id;
  const y = window.scrollY, root = document.getElementById('root');
  const waiting = S.job && ['mapping_submitted', 'export_requested'].includes(S.job.status) ? 1 : 0;
  const tabs = [['wizard', 'Wizard'], ['queue', 'Review queue'], ['audit', 'Audit log'], ['clients', 'Clients'], ['about', 'About']];
  const view = { wizard: viewWizard, queue: viewQueue, audit: viewAudit, clients: viewClients, about: viewAbout }[S.tab]();
  root.innerHTML = `<div class="demo-banner" role="note"><div class="wrap"><b>DEMO - synthetic data only.</b> Runs entirely in this page. It only prepares import files and never posts to Sage Intacct or QuickBooks Online.</div></div>
  <header class="top"><div class="wrap"><div class="brand"><b>JE</b> Journal Entry Prep</div>
    <nav class="tabs" aria-label="Sections">${tabs.map(([k, l]) => `<button class="tab" data-act="tab:${k}"${S.tab === k ? ' aria-current="page"' : ''}>${l}${k === 'queue' && waiting ? '<span class="pill">' + waiting + '</span>' : ''}</button>`).join('')}</nav>
    <div class="acting"><label for="sel-user">Acting as</label><select id="sel-user" aria-label="Demo user">${USERS.map(u => `<option value="${u.email}"${u.email === S.me.email ? ' selected' : ''}>${u.name}</option>`).join('')}</select>
      <select id="sel-role" aria-label="Role">${['preparer', 'reviewer', 'admin'].map(r => `<option value="${r}"${r === S.me.role ? ' selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select></div></div></header>
  <main class="wrap">${S.flash ? `<div class="note ${S.flash.kind}" role="${S.flash.kind === 'bad' ? 'alert' : 'status'}">${esc(S.flash.text)}</div>` : ''}${view}</main>`;
  window.scrollTo(0, y);
  if (active) { const el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
}
function go(fn) { try { S.flash = null; fn(); } catch (e) { say('bad', e.message || String(e)); } render(); }
function copyCsv() {
  const text = S.job.exported.csv, el = document.getElementById('csv-full') || document.getElementById('csv-pre');
  const fallback = () => { if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say('info', 'Copy was blocked here. The file text is selected: press Ctrl/Cmd+C.'); render(); };
  try { navigator.clipboard.writeText(text).then(() => { say('ok', 'Copied. Paste it into a text editor and save as .csv.'); render(); }, fallback); } catch (e) { fallback(); }
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const [act, ...arg] = t.dataset.act.split(':'), a = arg.join(':'), j = S.job;
  const acts = {
    tab: () => { S.tab = a; }, step: () => { S.tab = 'wizard'; S.step = +a; }, open: () => { S.tab = 'wizard'; S.step = +a; },
    scn: () => { const s = SCENARIOS.find(x => x.id === a); S.scenario = s; S.intake = { client: s.client, target: s.target, start: s.start, end: s.end, allocate: s.allocate }; S.suggest = s.file; },
    start: () => startJob(), 'reset-job': () => { S.job = null; S.step = null; S.tab = 'wizard'; S.flash = null; },
    file: () => { const f = DEMO.files.find(x => x.filename === a); useFile(f.filename, f.csv); },
    as: () => { const [email, role] = [arg[0], arg[1]]; const u = USERS.find(x => x.email === email); S.me = { email: u.email, name: u.name, role }; },
    suggest: () => suggestMapping(), 'save-map': () => { audit('mapping_saved', { sha: j.file.sha, details: { lines: j.draft.lines.length } }); say('ok', 'Mapping saved as a draft.'); },
    'submit-map': () => submitMapping(), 'approve-map': () => approveMapping(),
    'reject-map': () => rejectMapping((document.getElementById('rej-note') || {}).value || ''),
    'reopen-map': () => { j.draft.status = 'draft'; j.status = j.mappingRef ? 'ready' : 'needs_mapping'; audit('mapping_reopened'); say('info', 'Mapping reopened for editing.'); },
    'change-map': () => proposeChanges(), 'discard-draft': () => { j.draft = null; j.status = 'ready'; audit('mapping_draft_discarded'); say('info', 'Draft discarded; the approved mapping stays in use.'); },
    'tick-all': () => { j.draft.lines.forEach(l => { if (l.origin === 'ai' || l.origin === 'mock') l.reviewed = true; }); },
    'request-export': () => requestExport(), 'approve-export': () => approveExport(),
    'reject-export': () => rejectExport((document.getElementById('rej-note') || {}).value || ''),
    generate: () => generateExport(!!(document.getElementById('del-after') || {}).checked), 'copy-csv': () => { copyCsv(); return false; },
    tamper: () => { S.tamper = S.audit[Math.min(3, S.audit.length - 1)].actor_email; S.audit[Math.min(3, S.audit.length - 1)].actor_email = 'mallory@example.com'; },
    restore: () => { S.audit[Math.min(3, S.audit.length - 1)].actor_email = S.tamper; S.tamper = null; },
    'save-pct': () => {
      const c = clientOf('our-lady-grace'), vals = {}; document.querySelectorAll('[data-pct]').forEach(i => { vals[i.dataset.pct] = parseFloat(i.value); });
      const sum = Math.round(Object.values(vals).reduce((x, y) => x + y, 0) * 100);
      if (Object.values(vals).some(v => !(v >= 0 && v <= 100))) return say('bad', 'Each percentage must be a number from 0 to 100.');
      if (sum !== 10000) return say('bad', `Not saved: allocation percentages must add up to exactly 100 (they add up to ${sum / 100}).`);
      const before = Object.fromEntries(c.entities.map(e => [e.code, e.pct])); c.entities.forEach(e => { e.pct = vals[e.code]; });
      audit('client_updated', { client: c.id, job: null, details: { allocation_before: before, allocation_after: vals } }); say('ok', 'Client saved. The next allocated journal uses these percentages.');
    },
    noop: () => {},
  };
  if (!acts[act]) return;
  try { S.flash = null; if (acts[act]() === false) return; } catch (e) { say('bad', e.message || String(e)); }
  render();
});
document.addEventListener('change', ev => {
  const t = ev.target, j = S.job;
  if (t.id === 'sel-user') { const u = USERS.find(x => x.email === t.value); S.me = { email: u.email, name: u.name, role: u.role }; S.flash = null; return render(); }
  if (t.id === 'sel-role') { S.me.role = t.value; S.flash = null; return render(); }
  if (t.dataset.bind) { S.intake[t.dataset.bind] = t.value; S.scenario = null; return render(); }
  if (t.dataset.map && j && j.draft) {
    const [i, f] = t.dataset.map.split(':'), l = j.draft.lines[+i], c = clientOf(j.clientId);
    if (f === 'reviewed') l.reviewed = t.checked;
    else {
      l[f] = t.value;
      if (f === 'role' && t.value !== 'amount') { l.line_type = l.side = l.gl_account = l.offset_account = l.entity = l.fund = ''; }
      if (f === 'role' && t.value === 'amount') { const [e, fd] = defaultDims(c); l.entity = l.entity || e; l.fund = l.fund || fd; }
      if (f === 'gl_account') l.line_type = lineTypeFor(c, t.value) || l.line_type;
      if (l.origin !== 'ai' && l.origin !== 'mock' && l.origin !== 'rules' && l.origin !== 'saved') l.origin = 'manual';
    }
    return render();
  }
  if (t.id === 'own-file' && t.files && t.files[0] && j) {
    const file = t.files[0], r = new FileReader();
    if (file.size > 5 * 1024 * 1024) { say('bad', 'The file is larger than the 5 MB limit.'); return render(); }
    r.onload = () => { try { useFile(file.name, String(r.result)); } catch (e) { say('bad', e.message); } render(); };
    r.readAsText(file);
  }
});

/* ---------- boot ---------- */
(function init() {
  DEMO.clients.forEach(c => { S.clients[c.id] = prepClient(c); });
  const std = DEMO.files.find(f => f.filename === 'our-lady-grace_payroll_2026-10-15.csv'), sig = parseReport(std.csv).signature;
  const seed = { email: 'system', name: 'Demo seed', role: '' }, pat = USERS[0], rhea = USERS[1];
  DEMO.clients.forEach(c => audit('client_created', { actor: seed, client: c.id, job: null, details: { name: c.name, source: 'demo seed (synthetic data)' } }));
  DEMO.saved.forEach(m => {
    S.saved.push({ clientId: m.clientId, version: m.version, signature: sig, lines: m.lines, decidedBy: m.decidedBy, decidedAt: null, note: m.note });
    audit('mapping_submitted', { actor: pat, client: m.clientId, job: null, details: { note: m.note, seeded: true } });
    audit('mapping_approved', { actor: rhea, client: m.clientId, job: null, mv: m.version, details: { note: m.note, seeded: true } });
  });
  render();
})();
</script>
