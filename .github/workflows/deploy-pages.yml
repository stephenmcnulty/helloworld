name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [claude/accounting-finance-quiz-app-f8jap4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp accounting-finance-quiz.html _site/
          cp accounting-finance-quiz.html _site/index.html
          cp accounting-finance-quiz.webmanifest _site/
          cp accounting-finance-quiz-sw.js _site/
          cp -r icons _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
